name: Deploy Asyaikhoni to VPS

# Environment development dimatikan 2026-11-16: vhost, cert LE, DNS, dan
# /var/www/dev-asyaikhoni sudah dihapus. Deploy hanya untuk main (prod);
# deploy-asyaikhoni.sh juga menolak branch lain.
on:
  # Disabled 2026-11-16: GitHub Actions akun terkunci billing (setiap run gagal).
  # Deploy prod lewat pull-deploy.timer di VPS. Hidupkan lagi bila billing beres.
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            BRANCH="${{ github.ref_name }}"
            echo "Deploying branch: $BRANCH"
            /opt/ops/bin/deploy-asyaikhoni.sh "$BRANCH"
